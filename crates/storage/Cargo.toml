[package]
name = "desktop-assistant-storage"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
async-trait.workspace = true
desktop-assistant-auth-jwt.workspace = true
desktop-assistant-core.workspace = true
# `one_line`, the shared rule for reducing text to one bounded display line.
# The dream cycle's summary pass applies it to what the model returns, so a
# written summary and the stand-in a reader falls back to occupy one line of the
# same length.
desktop-assistant-protocol.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "json", "chrono", "uuid"] }
# AST-based SQL validation/rewriting for the LLM-exposed
# `execute_database_query` tool (#141). PostgreSQL dialect, used to:
# - confirm a single statement,
# - enforce SELECT-only on the read path,
# - graft `WHERE user_id = $N` onto references to personal-data tables,
# - confine writes to the `scratch` sandbox.
#
# `visitor` pulls in the derived `Visit` impls. The write-path checker needs a
# walk that covers the WHOLE AST rather than the shapes someone remembered to
# enumerate: the two escapes fixed in #721/#722 were both fields a hand-written
# walker never descended into.
sqlparser = { version = "0.62", features = ["visitor"] }
pgvector = { version = "0.4", features = ["sqlx"] }
serde.workspace = true
serde_json = "1"
tracing.workspace = true
chrono.workspace = true
tokio.workspace = true
# Cooperative cancellation for long maintenance passes (dreaming / consolidation
# / embedding recompute) so an on-demand run can be stopped via the task registry.
tokio-util.workspace = true
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
# Integration tests for the `execute_database_query` security contract
# (#141) wire the closure exactly as `crates/daemon/src/main.rs` does,
# then invoke it through `BuiltinToolService::execute_tool` so the
# end-to-end LLM-driven path is exercised verbatim.
desktop-assistant-mcp-client.workspace = true
# The executable `SkillIndexStore` contract, run against this adapter so the
# stores cannot diverge on catalog semantics.
desktop-assistant-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
