[package]
name = "desktop-assistant-mcp-client"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
desktop-assistant-core.workspace = true
# `one_line`, the shared rule for reducing text to one display line. The tool
# boundary cuts a knowledge summary with it so that a written summary and the
# content a reader falls back to when there is none are cut the same way. Taken from the
# crate that owns the rule; `core` re-exports the cap beside its own types but
# not the function. Path dependency, serde only, no native tail.
desktop-assistant-protocol.workspace = true
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
toml = "1"
chrono = { workspace = true, features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
# Unicode general categories, for the one question `std` cannot answer: is this
# character a display hazard? A spawned server's stderr is quoted back in a
# failure message that a log reader, the settings panel and the web SPA all
# render, so the categories that reorder or break the line around them - Cf
# (bidi overrides, zero-width marks) and Zl/Zp (U+2028/U+2029, which neither
# `serde_json` nor an HTML renderer treats as ordinary text) - have to go.
# `char::is_control` covers Cc only, and a hand-written list of the other
# ranges is a table that silently ages out of date with each Unicode release.
# Already in the lockfile via `stringprep`; no dependencies of its own, and
# `general-category` is the only feature compiled.
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# Remote streamable-HTTP transport + OAuth — behind the default `http` feature.
# Stdio-only consumers (the client-side MCP host in `client-common`) build with
# `default-features = false` and never compile any of these, so they don't pull
# `reqwest` at all (see the `[features]` note below).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"], optional = true }
# OAuth 2.0 token acquisition/refresh for remote (HTTP) MCP servers (#455).
# PKCE (S256) needs SHA-256 + base64url; the authorize URL builder needs url;
# code_verifier/state need a CSPRNG. Used only by the HTTP transport (oauth.rs).
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
url = { version = "2", optional = true }
rand = { version = "0.9", optional = true }

[features]
default = ["http"]
# The remote streamable-HTTP MCP transport (`connect_http*`, `HttpTransport`)
# and its OAuth 2.0 support (`oauth`). The daemon needs it (remote MCP servers,
# #455) so it's on by default. Stdio-only consumers turn it off with
# `default-features = false`, which drops `reqwest` (and the webpki-roots
# feature churn that comes with it) from their dependency tree entirely.
http = ["dep:reqwest", "dep:sha2", "dep:base64", "dep:url", "dep:rand"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
httpmock = "0.8"
tempfile = "3"
async-trait.workspace = true
# Log capture for the level-contract tests: they assert what does and does not
# reach a line at a given level, which needs a subscriber writing into a buffer.
tracing-subscriber.workspace = true

[lints]
workspace = true
