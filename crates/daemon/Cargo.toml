[package]
name = "desktop-assistant-daemon"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[features]
# Export telemetry to an OpenTelemetry collector. Off by default: with it off
# no opentelemetry crate is resolved at all, so `cargo install` costs a desktop
# user nothing. With it on the OTLP layers are added beside the console layer,
# never in place of it, so an exporting build still prints locally. Everything
# about where telemetry goes comes from the standard OTEL_* environment
# variables; there is no flag and no DESKTOP_ASSISTANT_* variable for it.
# `core` is named too: it holds the only code that gives a turn span the trace
# id its request id spells, and that code is behind that crate's own `otel`
# feature. Without this line an exporting daemon would produce spans whose
# trace ids nothing in a user report can find.
otel = ["adelie-telemetry/otel", "desktop-assistant-core/otel"]

[dependencies]
desktop-assistant-application = { path = "../application" }
desktop-assistant-peer-cred = { path = "../peer-cred" }
desktop-assistant-ws = { path = "../ws-interface", features = ["tls"] }
desktop-assistant-uds = { path = "../uds-interface" }
desktop-assistant-transport-dispatch = { path = "../transport-dispatch" }
desktop-assistant-core.workspace = true
desktop-assistant-llm-anthropic.workspace = true
desktop-assistant-llm-openai.workspace = true
desktop-assistant-llm-ollama.workspace = true
desktop-assistant-llm-bedrock.workspace = true
desktop-assistant-llm-openrouter.workspace = true
desktop-assistant-llm-azure.workspace = true
desktop-assistant-llm-google.workspace = true
desktop-assistant-mcp-client.workspace = true
desktop-assistant-storage.workspace = true
tokio.workspace = true
tokio-util.workspace = true
notify.workspace = true
zbus.workspace = true
anyhow.workspace = true
tracing.workspace = true
adelie-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
# Names the keys serde discarded while deserializing daemon.toml. `DaemonConfig`
# cannot carry `deny_unknown_fields` - see `unknown_config_keys` for why a stale
# key must not stop the daemon - so without this the whole of a misspelled table
# is thrown away in silence, which is how `[connection.name]` (singular) reached
# a shipped doc. The alternative is a hand-listed set of known keys, which is
# the same drift this guard exists to catch.
serde_ignored = "0.1.14"
thiserror.workspace = true
indexmap = { version = "2", features = ["serde"] }
# Non-poisoning RwLock for RegistryHandle (DT-9 / #276): a panic while a
# holder has the lock must not poison it and cascade into every later access.
parking_lot = "0.12"
chrono.workspace = true
async-trait.workspace = true
uuid = { version = "1", features = ["v4", "v7"] }
# keyring v4 split the library out into `keyring-core` (the API) plus
# per-backend store crates. We talk to the system Secret Service in-process
# via the zbus-based store, matching the daemon's existing zbus/tokio stack
# (no libdbus C dep) and the `crypto-rust` choice used by the TUI/GTK clients.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }
jsonwebtoken.workspace = true
desktop-assistant-auth-jwt.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
libc = "0.2"
subtle = "2"
zeroize = "1"
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
# 0.3.48 emits conflicting `From` impls that break coherence (E0119) against any
# blanket `impl<T> From<T>` (e.g. aws-smithy-types CanDisable, rcgen DnValue).
# cargo unifies `time` to one version graph-wide, so this bound guards all crates.
# Re-widen once a fixed release (>=0.3.49) is out.
time = ">=0.3, <0.3.48"
walkdir = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
# Log capture for the telemetry tests: they assert what the installed
# subscriber actually writes, which needs a layer over a buffer.
tracing-subscriber.workspace = true
tempfile = "3"
httpmock = "0.8"

[lints]
workspace = true
