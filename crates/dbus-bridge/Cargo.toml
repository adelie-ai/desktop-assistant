[package]
name = "desktop-assistant-dbus-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[[bin]]
name = "adelie-dbus-bridge"
path = "src/main.rs"

[lib]
name = "desktop_assistant_dbus_bridge"
path = "src/lib.rs"

[features]
# Export telemetry to an OpenTelemetry collector. Off by default: with it off
# no opentelemetry crate is resolved at all, so `cargo install` costs a desktop
# user nothing. With it on the OTLP layers are added beside the console layer,
# never in place of it, so an exporting build still prints locally. Everything
# about where telemetry goes comes from the standard OTEL_* environment
# variables; there is no flag and no ADELIE_BRIDGE_* variable for it.
otel = ["adelie-telemetry/otel"]

[dependencies]
adelie-telemetry.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive", "env"] }
desktop-assistant-api-model = { path = "../api-model" }
desktop-assistant-client-common = { path = "../client-common" }
desktop-assistant-frame-codec = { workspace = true }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
zbus.workspace = true

[dev-dependencies]
async-trait.workspace = true
desktop-assistant-auth-jwt.workspace = true
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[lints]
workspace = true
