[llm]
connector = "ollama"
model = "llama3.2:1b"
base_url = "http://ollama:11434"

[connections.default]
type = "ollama"
base_url = "http://ollama:11434"
# Slow CPU nodes: tolerate long first-response + inter-chunk gaps, keep the
# interactive model resident (no cold load per turn), and clamp the context
# so prompt-eval stays cheap.
connect_timeout_secs = 600
stream_timeout_secs = 300
keep_warm = true
max_context_tokens = 4096

[embeddings]

[database]
max_connections = 5

[backend_tasks]
# Off for the test so no surprise background LLM calls fire mid-smoke.
dreaming_enabled = false
dreaming_interval_secs = 3600
archive_after_days = 7
embedding_backfill_interval_secs = 300
consolidation_interval_secs = 86400
# Soft-deleted knowledge entries are reaped on their own cadence, independent
# of dreaming — otherwise an instance with dreaming off keeps every tombstone.
knowledge_trash_retention_days = 30
knowledge_trash_sweep_interval_secs = 3600
# What one consolidation run may destroy and rewrite, as a share of the active
# set. Set the prune share to 0 to keep a run's merges and decline its deletes.
knowledge_prune_fraction = 0.1
knowledge_rewrite_fraction = 0.25
# Set to true to reserve every permanent delete of a knowledge row to a person.
# A person's delete and empty-trash still erase; the sweep, the consolidation
# reap and the model's delete tool free nothing and log what they spared.
knowledge_hard_delete_requires_person = false

# Whether this daemon keeps the full text of every turn - the request as sent,
# the reply, the tool calls and their results. Absent, the deployment decides:
# on for a daemon reachable only over its Unix socket, off once the remote
# WebSocket door is open, because there the record is one person's whole
# conversation sitting where a second principal operates the store. State
# `enabled` to override either way; the boot log says which it resolved to.
# [inspector]
# enabled = false
# retention_days = 7

[purposes.interactive]
connection = "default"
model = "llama3.2:1b"

[purposes.dreaming]
connection = "default"
model = "llama3.2:1b"

[purposes.embedding]
connection = "default"
model = "llama3.2:1b"

[purposes.titling]
connection = "default"
model = "llama3.2:1b"

[ws_auth]
methods = ["password"]
allowed_origins = []

[tls]
enabled = false

# [authz]
# Who may change this instance's configuration over the network (#728). Empty by
# default: with no entry here, a WebSocket client is a tenant and is refused
# every service-configuration write, however it authenticated. A local Unix
# socket peer running as the daemon's own account is an administrator by
# construction, which is why a desktop needs no entry.
#
# This is the smoke-test base and it deliberately names nobody: the instance is
# configured from this file, not from a client. Set it in your own overlay when
# an operator administers the instance through a settings UI. File-only - no
# command writes it - so a restart is required after a change.
#
# Name the real subject. `"default"` is the storage schema's own sentinel rather
# than a person, and the daemon drops it from this list with a warning: a token
# that named nobody used to resolve to it, so admitting it here would have
# promoted every such connection.
#
# admin_subjects = ["operator"]

[personality]
professionalism = "always"
warmth = "often"
directness = "often"
enthusiasm = "sometimes"
humor = "sometimes"
sarcasm = "rarely"
pretentiousness = "rarely"
