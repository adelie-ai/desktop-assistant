title = "desktop-assistant private-information scan"

# The second pass of the gate. .gitleaks.toml finds CREDENTIALS; this file
# finds PRIVATE INFORMATION - an absolute home path naming an account, a
# hostname on a private network. Nothing here is a credential, which is why
# every one of these strings passed the gate for as long as it sat in the
# tree. They arrive the same way each time: someone illustrates a point with
# real output from the running system, and the output carries the machine it
# came from.
#
# These rules match SHAPES, never site-specific values. This file is published
# with the repository, so an instance name or a private domain written here
# would be the leak, permanently, in git history. The site-specific literals
# live in an optional host-local file outside the repository, which
# scripts/secret-scan.sh appends to this one when it is present - see
# AGENTS.md, "Secret scanning". A clone that has no such file still scans and
# still passes on these rules alone.

# Deliberately NOT extended from gitleaks' bundled configuration, and that is
# the whole reason this is a separate pass rather than more rules in
# .gitleaks.toml. The bundled config carries a global allowlist whose regexes
# discard findings by their CONTENT, and they discard exactly the content
# these rules exist to find:
#
#   (?i)^true|false|null$   the ^ binds to the first alternative only, so this
#                           drops any secret that STARTS WITH "true", CONTAINS
#                           "false", or ENDS WITH "null" - case-insensitively
#   ^(?i:a+|b+|...|z+)$     drops any secret that is one repeated letter
#   ^/(?:bin|etc|home|opt|tmp|usr|var)/[\w ./-]+$
#                           drops any secret that is a whole absolute path
#
# Measured against the pinned binary while these rules were still extending
# the default set: of six realistic account names, /home/mallory was reported
# and /home/trueman, /home/TrueUser, /home/isfalseuser, /home/reginald-null
# and /home/xx were all silently discarded - no finding, no warning, exit 0.
# No arrangement of secretGroup avoids this, because "contains false" cannot
# be dodged by choosing which part of the match to report. Running these rules
# in their own pass, with no inherited allowlist, removes the class outright.
# Credentials keep the bundled rules: that is what .gitleaks.toml is for, and
# every file exempted below is still scanned by that pass.
[extend]
useDefault = false

[[allowlists]]
description = "Generated, vendored and binary content: never hand-authored, so never a place a home path or a hostname gets typed, and large enough to make the pass slow for no benefit. Declared here because this pass inherits nothing - the equivalent list in gitleaks' bundled config does not apply to it. .git is matched as both a directory and a FILE: in a linked worktree, .git is a one-line file holding an absolute path to the real git directory, which is machine state rather than repository content."
paths = [
  '''(^|/)\.git(/|$)''',
  '''(^|/)target/''',
  '''(^|/)build/''',
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
  '''(?i)\.(?:bmp|gif|ico|jpe?g|png|svg|tiff?|webp)$''',
  '''(?i)\.(?:eot|[ot]tf|woff2?)$''',
  '''(?i)\.(?:bin|dll|dylib|exe|gz|onnx|pdf|so|wasm|xz|zip|zst)$''',
]

[[allowlists]]
description = "The two files that must contain these patterns in order to define and to test them. gitleaks scans the working tree, so without this a clean checkout fails its own gate - and a clean tree that fails is exactly the noise that trains people to bypass it. Whole-file exemption is safe HERE and only here: this pass carries no credential rules, and .gitleaks.toml's pass still scans both files for secrets. Matched by path suffix, never by bare filename or directory, so the exemption holds wherever the file is checked out - including under .claude/worktrees/."
paths = [
  '''(^|/)\.gitleaks-private-info\.toml$''',
  '''(^|/)scripts/tests/secret-scan-gate\.test\.sh$''',
]

[[rules]]
id = "adele-absolute-home-path"
description = "An absolute home directory naming a real account (/home/<name>, /Users/<name>). It identifies the machine and the person, and it arrives without anyone deciding to write it - pasted terminal output, a captured log, an error message. Use a workspace-relative path, $HOME, ~ or /home/<user> instead (AGENTS.base.md rule 5.2). The account name is reported on its own, so the placeholders below are exempted by name. The name may not end in a dot or a hyphen, so a placeholder that ends a sentence is still recognised as itself rather than as a different name with the full stop attached."
regex = '''/(?:home|Users)/([A-Za-z](?:[A-Za-z0-9._-]*[A-Za-z0-9])?)'''
secretGroup = 1

[[rules.allowlists]]
description = "Account names that are placeholders, not people. The first two are the substitutes rule 5.2 names; the rest are the synthetic accounts this repository's own fixtures, documentation and container images already use, so the rule does not fail a clean tree. /home/<user>, /home/$USER, ${HOME} and ~ need no entry - none of them can match the rule's own account-name pattern. Adding a name here is a decision that the name identifies nobody; where it does identify someone, change the fixture instead."
regexes = [
  '''^(?:user|example|assistant|ada|ada-client|peer|x)$''',
]

[[rules]]
id = "adele-private-network-hostname"
description = "A hostname whose LAST label is a pseudo-TLD that public DNS never delegates (.lab, .lan, .corp, .home). Such a name resolves only inside one private network, so it identifies infrastructure that is not meant to be public, whatever the host is called - which is why this matches the suffix and needs no site name written into a public file. Use example.com, or a placeholder, in documentation instead (AGENTS.base.md rule 5.2). The trailing alternation requires the pseudo-TLD to end the hostname, so an ordinary public name that merely uses one of these words as a subdomain - notebooks.lab.example.com - is not a match, while a private host followed by a port, a path or a full stop still is."
regex = '''\b([a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.(?:lab|lan|corp|home))(?:$|[^a-zA-Z0-9._-]|\.[^a-zA-Z0-9_-])'''
secretGroup = 1
